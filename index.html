<!DOCTYPE html>
<html>
<head>
<title>Elite Agency</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;font-family:Poppins;background:#0b0b0b;color:white;overflow-x:hidden}
.hero{height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;
background:linear-gradient(120deg,#000,#1f2933)}
.btn{padding:15px 35px;background:#22c55e;color:black;border-radius:30px;
text-decoration:none;font-weight:bold;position:relative;overflow:hidden}
.section{padding:80px;text-align:center}
.card{background:#111;padding:30px;margin:20px;border-radius:20px;
opacity:0;transform:translateY(40px);transition:0.6s}
.show{opacity:1;transform:translateY(0)}
</style>
</head>
<body>

<div class="hero">
<div>
<h1>Elite Digital Agency</h1>
<p>We build brands online</p>
<a class="btn" href="https://wa.me/919999999999">Start Now</a>
</div>
</div>

<div class="section">
<h2>Services</h2>
<div class="card">Website Design</div>
<div class="card">WhatsApp Leads</div>
<div class="card">Google Visibility</div>
</div>

<script>
const cards=document.querySelectorAll('.card');
window.addEventListener('scroll',()=>{
 cards.forEach(c=>{
  const top=c.getBoundingClientRect().top;
  if(top<window.innerHeight-100) c.classList.add('show');
 });
});
</script>
</body>
</html>
